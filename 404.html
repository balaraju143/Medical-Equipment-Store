<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>404 - Stackly Medical</title>


    <!-- MANROPE -->

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <!-- MATERIAL SYMBOLS -->

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet">


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/404.css">


    <!-- GSAP -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
    </script>

</head>


<body>


<!-- =========================================
     404 PAGE
========================================= -->

<section class="stackly-404-page">


    <!-- BACKGROUND DECORATIONS -->

    <div class="medical-glow glow-one"></div>

    <div class="medical-glow glow-two"></div>

    <div class="medical-glow glow-three"></div>


    <!-- DOT PATTERNS -->

    <div class="dot-pattern dots-left"></div>

    <div class="dot-pattern dots-right"></div>


    <!-- HEXAGONS -->

    <div class="medical-hex hex-one"></div>

    <div class="medical-hex hex-two"></div>

    <div class="medical-hex hex-three"></div>


    <!-- PLUS SYMBOLS -->

    <div class="medical-plus plus-one">+</div>

    <div class="medical-plus plus-two">+</div>

    <div class="medical-plus plus-three">+</div>

    <div class="medical-plus plus-four">+</div>


    <!-- CURVED LINES -->

    <div class="medical-curve curve-one"></div>

    <div class="medical-curve curve-two"></div>


    <!-- =====================================
         MAIN CARD
    ====================================== -->

    <div class="stackly-404-card">


        <!-- LOGO -->

      <a
    href="index.html"
    class="stackly-404-logo">

    <img
        src="assets/logo 4.webp"
        alt="Stackly"
        class="stackly-404-logo-img">

</a>
        <!-- 404 -->

        <div class="error-number">


            <span class="error-four">
                4
            </span>


            <span class="error-zero">

                <span class="zero-glow"></span>

                <span class="stethoscope">

                    <span class="stetho-tube"></span>

                    <span class="stetho-head"></span>

                </span>

            </span>


            <span class="error-four">
                4
            </span>


        </div>


        <!-- TITLE -->

        <h1>
            Page <span>Not Found</span>
        </h1>


        <!-- DESCRIPTION -->

        <p class="error-description">

            The medical page, healthcare resource, or product
            information you are looking for may have been moved,
            temporarily unavailable, or no longer exists.

        </p>


        <!-- BUTTONS -->

        <div class="error-actions">


            <a
                href="index.html"
                class="error-home-btn">

                <span class="material-symbols-outlined">
                    home
                </span>

                Back to Home

            </a>


            <button
                type="button"
                class="error-back-btn"
                onclick="goBack()">

                <span class="material-symbols-outlined">
                    undo
                </span>

                Go to Previous Page

            </button>


        </div>


    </div>


</section>


<script src="js/404.js"></script>

</body>

</html>
